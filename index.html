<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#7cc8ef">
<title>KOTA NEO — Episode 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="gl"></canvas>

<div id="load">
  <div class="load-logo">KOTA NEO</div>
  <div class="load-sub">Episode 1 · Kota yang menunggu warga pertama</div>
  <div class="load-bar"><i id="loadBar"></i></div>
  <div class="load-msg" id="loadMsg">Menyiapkan jalan kota…</div>
  <div class="load-sub" style="font-size:14px">Wajib follow TikTok @kotaneoid untuk update terbaru</div>
</div>

<div id="ui"></div>

<!-- Skrip dimuat berurutan dengan penanda waktu (?v=) agar browser/GitHub Pages TIDAK memakai file lama dari cache.
     Urutan penting: data → config → save → collision → renderer → kamera → pemain → net → npc → dunia → ui → main -->
<script>
(function(){
  var files=['data','config','save','collision','renderer','camera','player','net','npc','world','ui','main'],v=Date.now(),i=0;
  function fail(f){var m=document.getElementById('loadMsg');if(m)m.textContent='Gagal memuat file: '+f+'.js — periksa apakah file itu sudah diunggah ke GitHub.';var e=document.getElementById('load');if(e)e.style.display='flex'}
  (function next(){
    if(i>=files.length)return;var f=files[i++],s=document.createElement('script');
    s.src=f+'.js?v='+v;s.async=false;s.onload=next;s.onerror=function(){fail(f)};document.body.appendChild(s)
  })()
})();
</script>
<noscript>Game ini membutuhkan JavaScript.</noscript>
</body>
</html>
